<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>web-backend</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: grid; place-content: center; text-align: center; min-height: 100vh; margin: 0; }
  #count { font-size: 64px; font-weight: 600; }
  button { font: inherit; padding: 8px 24px; }
</style>
</head>
<body>
  <h1>Hello world</h1>
  <div id="count">0</div>
  <p><button id="btn">Click</button></p>
  <p id="status"></p>
<script>
  // The page only ever reads state.json (via /state) and POSTs events; the agent does the rest.
  const $ = (id) => document.getElementById(id);
  let state = { count: 0, handled: 0 }, sent = 0, inflight = false;

  function render() {
    const waiting = inflight || sent > (state.handled || 0);
    $("count").textContent = state.count || 0;
    $("btn").disabled = waiting;
    $("status").textContent = waiting ? "waiting for Claude…" : "";
  }

  async function poll() {
    try { state = await (await fetch("/state", { cache: "no-store" })).json(); } catch { /* server restarting: keep the last state */ }
    render();
    setTimeout(poll, 1000);
  }

  $("btn").onclick = async () => {
    inflight = true; render();
    try {
      const r = await fetch("/event", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "click" }) });
      if (r.ok) sent = (await r.json()).seq;
    } catch { /* not delivered: the button comes back so it can be pressed again */ }
    inflight = false; render();
  };

  poll();
</script>
</body>
</html>
